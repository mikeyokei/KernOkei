<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerning Pair Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#333333',
                        accent: '#00FF00',
                        light: '#FFFFFF',
                        gray: '#EEEEEE'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['Menlo', 'Monaco', 'Consolas', 'monospace'],
                        cheltender: ['Cheltender-Regular', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'Cheltender-Regular';
            src: url('Cheltender-Regular.woff2') format('woff2'),
                 url('Cheltender-Regular.woff') format('woff'),
                 url('Cheltender-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        /* Base kerning and stylistic set classes */
        .kern-display {
            font-feature-settings: "kern" 1;
        }
        .no-kern {
            font-feature-settings: "kern" 0;
        }
        
        /* Stylistic set classes */
        .ss01 { font-feature-settings: "ss01" 1; }
        .ss02 { font-feature-settings: "ss02" 1; }
        .ss03 { font-feature-settings: "ss03" 1; }
        .ss04 { font-feature-settings: "ss04" 1; }
        .ss05 { font-feature-settings: "ss05" 1; }
        .ss06 { font-feature-settings: "ss06" 1; }
        .ss07 { font-feature-settings: "ss07" 1; }
        .ss08 { font-feature-settings: "ss08" 1; }
        .ss09 { font-feature-settings: "ss09" 1; }
        .ss10 { font-feature-settings: "ss10" 1; }
        .ss11 { font-feature-settings: "ss11" 1; }
        .ss12 { font-feature-settings: "ss12" 1; }
        .ss13 { font-feature-settings: "ss13" 1; }
        .ss14 { font-feature-settings: "ss14" 1; }
        .ss15 { font-feature-settings: "ss15" 1; }
        .ss16 { font-feature-settings: "ss16" 1; }
        .ss17 { font-feature-settings: "ss17" 1; }
        .ss18 { font-feature-settings: "ss18" 1; }
        .ss19 { font-feature-settings: "ss19" 1; }
        .ss20 { font-feature-settings: "ss20" 1; }
        
        /* Custom scrollbar */
        .results-container {
            max-height: 250px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #000000 #eeeeee;
        }
        .results-container::-webkit-scrollbar {
            width: 4px;
        }
        .results-container::-webkit-scrollbar-track {
            background: #eeeeee;
        }
        .results-container::-webkit-scrollbar-thumb {
            background-color: #000000;
        }
        
        /* Brutalist UI styles */
        input, select, button {
            border-radius: 0 !important;
        }
        
        .btn-primary {
            @apply bg-black text-white uppercase text-xs tracking-wider px-4 py-2 border border-black hover:bg-gray-900 transition-colors;
        }
        
        .btn-secondary {
            @apply bg-white text-black uppercase text-xs tracking-wider px-4 py-2 border border-black hover:bg-gray-100 transition-colors;
        }
        
        .btn-outline {
            @apply bg-white text-black uppercase text-xs tracking-wider px-4 py-2 border border-black hover:bg-gray-100 transition-colors;
        }
        
        .toggle-btn {
            @apply px-3 py-1 text-xs uppercase tracking-wider transition-colors border border-black;
        }
        
        .toggle-btn-active {
            @apply bg-black text-white;
        }
        
        .toggle-btn-inactive {
            @apply bg-white text-black;
        }
        
        .section-title {
            @apply text-xs uppercase tracking-wider font-medium border-b border-black pb-1 mb-4;
        }
        
        .results-box {
            @apply border border-black;
        }
        
        .results-header {
            @apply border-b border-black flex justify-between items-center px-4 py-3 bg-gray-100;
        }
    </style>
</head>
<body class="bg-white text-black min-h-screen font-sans">
    <header class="bg-black text-white py-4 border-b border-black">
        <div class="container mx-auto px-4 max-w-6xl flex items-center justify-between">
            <h1 class="text-xl font-bold uppercase tracking-wider">KERNING PAIR CHECKER</h1>
            <p class="text-sm tracking-wider uppercase">FONT: <span id="currentFontName">CHELTENDER-REGULAR</span></p>
        </div>
    </header>
    
    <main class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="border border-black p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="flex flex-col">
                    <label for="selectedLetter" class="block text-xs uppercase tracking-wider mb-2 font-bold">Select Letter</label>
                    <div class="flex space-x-0 items-center">
                        <input type="text" id="selectedLetter" maxlength="1" class="w-16 h-12 text-center text-2xl border border-black bg-white" />
                        <button id="checkButton" class="btn-primary h-12">
                            GENERATE
                        </button>
                    </div>
                </div>
                
                <div class="flex flex-col">
                    <label class="block text-xs uppercase tracking-wider mb-2 font-bold">Character Sets</label>
                    <div class="flex flex-wrap gap-0">
                        <button id="toggleLatinBtn" class="toggle-btn toggle-btn-active" disabled>LATIN</button>
                        <button id="toggleLatinDiacriticsBtn" class="toggle-btn toggle-btn-inactive">DIACRITICS</button>
                        <button id="toggleVietnameseBtn" class="toggle-btn toggle-btn-inactive">VIETNAMESE</button>
                        <button id="toggleNumbersBtn" class="toggle-btn toggle-btn-inactive">NUMBERS</button>
                        <button id="togglePunctuationBtn" class="toggle-btn toggle-btn-inactive">PUNCTUATION</button>
                        <button id="toggleSymbolsBtn" class="toggle-btn toggle-btn-inactive">SYMBOLS</button>
                    </div>
                </div>
                
                <div class="flex flex-col">
                    <label for="fontUpload" class="block text-xs uppercase tracking-wider mb-2 font-bold">Upload Font</label>
                    <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2" class="block w-full text-sm border border-black px-3 py-2 bg-white" />
                    <p class="text-xs uppercase mt-2">DEFAULT: CHELTENDER-REGULAR</p>
                </div>
            </div>
            
            <div class="mt-8 flex gap-6 items-center flex-wrap">
                <div class="flex items-center">
                    <input type="checkbox" id="toggleKerning" class="mr-2 h-4 w-4 border-black" checked />
                    <label for="toggleKerning" class="text-xs uppercase tracking-wider font-bold">KERNING</label>
                </div>
                
                <div class="flex items-center">
                    <label for="fontSizeSelect" class="text-xs uppercase tracking-wider mr-2 font-bold">SIZE</label>
                    <select id="fontSizeSelect" class="text-sm border border-black px-2 py-1 bg-white uppercase">
                        <option value="text-xl">SMALL</option>
                        <option value="text-2xl" selected>MEDIUM</option>
                        <option value="text-3xl">LARGE</option>
                        <option value="text-4xl">XL</option>
                    </select>
                </div>
                
                <div>
                    <label for="stylisticSetSelect" class="text-xs uppercase tracking-wider mr-2 font-bold">OPENTYPE</label>
                    <select id="stylisticSetSelect" class="text-sm border border-black px-2 py-1 bg-white">
                        <option value="none">NO STYLISTIC SET</option>
                        <option value="ss01">STYLISTIC SET 1</option>
                        <option value="ss02">STYLISTIC SET 2</option>
                        <option value="ss03">STYLISTIC SET 3</option>
                        <option value="ss04">STYLISTIC SET 4</option>
                        <option value="ss05">STYLISTIC SET 5</option>
                        <option value="ss06">STYLISTIC SET 6</option>
                        <option value="ss07">STYLISTIC SET 7</option>
                        <option value="ss08">STYLISTIC SET 8</option>
                        <option value="ss09">STYLISTIC SET 9</option>
                        <option value="ss10">STYLISTIC SET 10</option>
                        <option value="ss11">STYLISTIC SET 11</option>
                        <option value="ss12">STYLISTIC SET 12</option>
                        <option value="ss13">STYLISTIC SET 13</option>
                        <option value="ss14">STYLISTIC SET 14</option>
                        <option value="ss15">STYLISTIC SET 15</option>
                        <option value="ss16">STYLISTIC SET 16</option>
                        <option value="ss17">STYLISTIC SET 17</option>
                        <option value="ss18">STYLISTIC SET 18</option>
                        <option value="ss19">STYLISTIC SET 19</option>
                        <option value="ss20">STYLISTIC SET 20</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="mb-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-sm uppercase tracking-wider font-bold">RESULTS</h2>
                <div class="flex space-x-0">
                    <button id="copyAllButton" class="btn-secondary">
                        <span class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            COPY ALL
                        </span>
                    </button>
                    <button id="regenerateButton" class="btn-outline hidden">
                        <span class="flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            REGENERATE
                        </span>
                    </button>
                </div>
            </div>
            
            <!-- Pairs Section -->
            <div class="mb-8">
                <div class="section-title">
                    <h3>LETTER PAIRS</h3>
                </div>
                
                <div class="results-box mb-4">
                    <div class="results-header">
                        <span class="text-xs uppercase tracking-wider font-bold">FIRST POSITION</span>
                        <button class="copy-btn text-black hover:text-gray-700 text-sm flex items-center" data-target="firstPosResults">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            COPY
                        </button>
                    </div>
                    <div id="firstPosResults" class="p-5 font-kerning-custom text-2xl break-words results-container"></div>
                </div>
                
                <div class="results-box">
                    <div class="results-header">
                        <span class="text-xs uppercase tracking-wider font-bold">SECOND POSITION</span>
                        <button class="copy-btn text-black hover:text-gray-700 text-sm flex items-center" data-target="secondPosResults">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            COPY
                        </button>
                    </div>
                    <div id="secondPosResults" class="p-5 font-kerning-custom text-2xl break-words results-container"></div>
                </div>
            </div>
            
            <!-- Triplets Section -->
            <div>
                <div class="section-title">
                    <h3>LETTER TRIPLETS</h3>
                </div>
                
                <div class="results-box mb-4">
                    <div class="results-header">
                        <span class="text-xs uppercase tracking-wider font-bold">FIRST POSITION</span>
                        <button class="copy-btn text-black hover:text-gray-700 text-sm flex items-center" data-target="tripletFirstResults">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            COPY
                        </button>
                    </div>
                    <div id="tripletFirstResults" class="p-5 font-kerning-custom text-2xl break-words results-container"></div>
                </div>
                
                <div class="results-box mb-4">
                    <div class="results-header">
                        <span class="text-xs uppercase tracking-wider font-bold">MIDDLE POSITION</span>
                        <button class="copy-btn text-black hover:text-gray-700 text-sm flex items-center" data-target="tripletMiddleResults">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            COPY
                        </button>
                    </div>
                    <div id="tripletMiddleResults" class="p-5 font-kerning-custom text-2xl break-words results-container"></div>
                </div>
                
                <div class="results-box">
                    <div class="results-header">
                        <span class="text-xs uppercase tracking-wider font-bold">LAST POSITION</span>
                        <button class="copy-btn text-black hover:text-gray-700 text-sm flex items-center" data-target="tripletLastResults">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            COPY
                        </button>
                    </div>
                    <div id="tripletLastResults" class="p-5 font-kerning-custom text-2xl break-words results-container"></div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="bg-black text-white py-4 mt-12">
        <div class="container mx-auto px-4 max-w-6xl text-center">
            <p class="text-sm uppercase tracking-wider">KERNING PAIR CHECKER TOOL</p>
        </div>
    </footer>

    <script>
        // Character sets
        const latinAlphabet = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const latinDiacritics = 'àáâäæãåāèéêëēėęîïíīįìôöòóœøōõûüùúūÿÀÁÂÄÆÃÅĀÈÉÊËĒĖĘÎÏÍĪĮÌÔÖÒÓŒØŌÕÛÜÙÚŪŸçÇñÑßðÐþÞ';
        const vietnameseChars = 'ăâđêôơưĂÂĐÊÔƠƯáàảãạăắằẳẵặâấầẩẫậéèẻẽẹêếềểễệíìỉĩịóòỏõọôốồổỗộơớờởỡợúùủũụưứừửữựýỳỷỹỵÁÀẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬÉÈẺẼẸÊẾỀỂỄỆÍÌỈĨỊÓÒỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢÚÙỦŨỤƯỨỪỬỮỰÝỲỶỸỴ';
        const numbers = '0123456789';
        const punctuation = '.,;:!?\'"\\/()[]{}<>@#$%^&*_-+=|~`';
        const symbols = '€£¥₹₽¢¤§©®™°′″‰¶†‡•…‱⁂⁋⁎⁑⁠⁰⁴⁵⁶⁷⁸⁹⁺⁻⁼⁽⁾ⁿ₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎';

        // DOM Elements
        const selectedLetterInput = document.getElementById('selectedLetter');
        const checkButton = document.getElementById('checkButton');
        const toggleVietnameseBtn = document.getElementById('toggleVietnameseBtn');
        const toggleNumbersBtn = document.getElementById('toggleNumbersBtn');
        const togglePunctuationBtn = document.getElementById('togglePunctuationBtn');
        const toggleLatinBtn = document.getElementById('toggleLatinBtn');
        const toggleLatinDiacriticsBtn = document.getElementById('toggleLatinDiacriticsBtn');
        const toggleSymbolsBtn = document.getElementById('toggleSymbolsBtn');
        const fontUpload = document.getElementById('fontUpload');
        const fontSizeSelect = document.getElementById('fontSizeSelect');
        const toggleKerning = document.getElementById('toggleKerning');
        const stylisticSetSelect = document.getElementById('stylisticSetSelect');
        const regenerateButton = document.getElementById('regenerateButton');
        const copyAllButton = document.getElementById('copyAllButton');
        const currentFontName = document.getElementById('currentFontName');

        // State
        let includeVietnamese = false;
        let includeNumbers = false;
        let includePunctuation = false;
        let includeLatinDiacritics = false;
        let includeSymbols = false;
        let includeLatin = true; // Always true
        let customFontName = 'CHELTENDER-REGULAR'; // Default font name

        // Font upload handling
        fontUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const fontData = e.target.result;
                    const fontName = file.name.split('.')[0].toUpperCase();
                    customFontName = fontName;
                    
                    // Create a new @font-face rule for the uploaded font
                    const fontFace = `
                        @font-face {
                            font-family: '${fontName}';
                            src: url('${fontData}') format('${getFormat(file.name)}');
                            font-weight: normal;
                            font-style: normal;
                        }
                    `;
                    
                    // Add the new font-face to the document
                    const style = document.createElement('style');
                    style.textContent = fontFace;
                    document.head.appendChild(style);
                    
                    // Update all text with the new font
                    updateStyles();
                    
                    // Update the font name in the header
                    currentFontName.textContent = fontName;
                };
                
                reader.readAsDataURL(file);
            }
        });

        // Helper function to determine font format
        function getFormat(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch (ext) {
                case 'ttf': return 'truetype';
                case 'otf': return 'opentype';
                case 'woff': return 'woff';
                case 'woff2': return 'woff2';
                default: return 'truetype';
            }
        }

        // Toggle button style helper
        function updateButtonStyle(button, isActive) {
            if (isActive) {
                button.classList.remove('toggle-btn-inactive');
                button.classList.add('toggle-btn-active');
            } else {
                button.classList.remove('toggle-btn-active');
                button.classList.add('toggle-btn-inactive');
            }
        }

        // Toggle button event listeners
        toggleVietnameseBtn.addEventListener('click', () => {
            includeVietnamese = !includeVietnamese;
            updateButtonStyle(toggleVietnameseBtn, includeVietnamese);
            generatePairs();
        });

        toggleNumbersBtn.addEventListener('click', () => {
            includeNumbers = !includeNumbers;
            updateButtonStyle(toggleNumbersBtn, includeNumbers);
            generatePairs();
        });

        togglePunctuationBtn.addEventListener('click', () => {
            includePunctuation = !includePunctuation;
            updateButtonStyle(togglePunctuationBtn, includePunctuation);
            generatePairs();
        });
        
        toggleLatinDiacriticsBtn.addEventListener('click', () => {
            includeLatinDiacritics = !includeLatinDiacritics;
            updateButtonStyle(toggleLatinDiacriticsBtn, includeLatinDiacritics);
            generatePairs();
        });
        
        toggleSymbolsBtn.addEventListener('click', () => {
            includeSymbols = !includeSymbols;
            updateButtonStyle(toggleSymbolsBtn, includeSymbols);
            generatePairs();
        });

        // Font size, kerning, and stylistic set change listeners
        fontSizeSelect.addEventListener('change', updateStyles);
        toggleKerning.addEventListener('change', updateStyles);
        stylisticSetSelect.addEventListener('change', updateStyles);

        // Generate pairs and triplets when the button is clicked
        checkButton.addEventListener('click', generatePairs);

        // Allow generating pairs by pressing Enter in the input field
        selectedLetterInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                generatePairs();
            }
        });

        // Set initial focus
        selectedLetterInput.focus();

        // Main function to generate pairs and triplets
        function generatePairs() {
            const selectedLetter = selectedLetterInput.value;
            
            if (!selectedLetter) {
                alert('Please enter a letter first');
                return;
            }

            // Get the active character set
            let charSet = latinAlphabet;
            if (includeLatinDiacritics) charSet += latinDiacritics;
            if (includeVietnamese) charSet += vietnameseChars;
            if (includeNumbers) charSet += numbers;
            if (includePunctuation) charSet += punctuation;
            if (includeSymbols) charSet += symbols;

            // Show regenerate button if it's hidden
            regenerateButton.classList.remove('hidden');
            
            // First position pairs
            const firstPosResults = document.getElementById('firstPosResults');
            firstPosResults.innerHTML = '';
            for (const char of charSet) {
                const span = document.createElement('span');
                span.textContent = selectedLetter + char + ' ';
                firstPosResults.appendChild(span);
            }
            
            // Second position pairs
            const secondPosResults = document.getElementById('secondPosResults');
            secondPosResults.innerHTML = '';
            for (const char of charSet) {
                const span = document.createElement('span');
                span.textContent = char + selectedLetter + ' ';
                secondPosResults.appendChild(span);
            }
            
            // First position triplets
            const tripletFirstResults = document.getElementById('tripletFirstResults');
            tripletFirstResults.innerHTML = '';
            for (let i = 0; i < charSet.length; i++) {
                for (let j = 0; j < charSet.length; j++) {
                    if (i % 5 === 0 && j % 5 === 0) { // Limit triplets to avoid too many
                        const span = document.createElement('span');
                        span.textContent = selectedLetter + charSet[i] + charSet[j] + ' ';
                        tripletFirstResults.appendChild(span);
                    }
                }
            }
            
            // Middle position triplets
            const tripletMiddleResults = document.getElementById('tripletMiddleResults');
            tripletMiddleResults.innerHTML = '';
            for (let i = 0; i < charSet.length; i++) {
                for (let j = 0; j < charSet.length; j++) {
                    if (i % 5 === 0 && j % 5 === 0) { // Limit triplets to avoid too many
                        const span = document.createElement('span');
                        span.textContent = charSet[i] + selectedLetter + charSet[j] + ' ';
                        tripletMiddleResults.appendChild(span);
                    }
                }
            }
            
            // Last position triplets
            const tripletLastResults = document.getElementById('tripletLastResults');
            tripletLastResults.innerHTML = '';
            for (let i = 0; i < charSet.length; i++) {
                for (let j = 0; j < charSet.length; j++) {
                    if (i % 5 === 0 && j % 5 === 0) { // Limit triplets to avoid too many
                        const span = document.createElement('span');
                        span.textContent = charSet[i] + charSet[j] + selectedLetter + ' ';
                        tripletLastResults.appendChild(span);
                    }
                }
            }
            
            // Apply styles to all results
            updateStyles();
