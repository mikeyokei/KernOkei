<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerning Pair Checker</title>
    <meta name="description" content="A web-based tool for type designers and typographers to check kerning pairs in fonts. Test custom fonts with various character sets.">
    <meta name="author" content="mikeyokei">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#8DD3C7', // Pastel teal instead of neon green
                        dark: '#121212',
                        light: '#FFFFFF'
                    },
                    fontFamily: {
                        cheltender: ['Cheltender-Regular', 'sans-serif']
                    }
                }
            },
            darkMode: 'class',
        }
    </script>
    <style>
        @font-face {
            font-family: 'Cheltender-Regular';
            src: url('Cheltender-Regular.woff2') format('woff2'),
                 url('Cheltender-Regular.woff') format('woff'),
                 url('Cheltender-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        
        /* Preload critical fonts */
        @media screen {
            :root::before {
                position: absolute;
                width: 0;
                height: 0;
                overflow: hidden;
                z-index: -1;
                content: url('Cheltender-Regular.woff2');
            }
        }
        
        /* Base kerning and stylistic set classes */
        .kern-display {
            font-feature-settings: "kern" 1;
        }
        .no-kern {
            font-feature-settings: "kern" 0;
        }
        
        /* Stylistic set classes */
        .ss01 { font-feature-settings: "ss01" 1; }
        .ss02 { font-feature-settings: "ss02" 1; }
        .ss03 { font-feature-settings: "ss03" 1; }
        .ss04 { font-feature-settings: "ss04" 1; }
        .ss05 { font-feature-settings: "ss05" 1; }
        .ss06 { font-feature-settings: "ss06" 1; }
        .ss07 { font-feature-settings: "ss07" 1; }
        .ss08 { font-feature-settings: "ss08" 1; }
        .ss09 { font-feature-settings: "ss09" 1; }
        .ss10 { font-feature-settings: "ss10" 1; }
        .ss11 { font-feature-settings: "ss11" 1; }
        .ss12 { font-feature-settings: "ss12" 1; }
        .ss13 { font-feature-settings: "ss13" 1; }
        .ss14 { font-feature-settings: "ss14" 1; }
        .ss15 { font-feature-settings: "ss15" 1; }
        .ss16 { font-feature-settings: "ss16" 1; }
        .ss17 { font-feature-settings: "ss17" 1; }
        .ss18 { font-feature-settings: "ss18" 1; }
        .ss19 { font-feature-settings: "ss19" 1; }
        .ss20 { font-feature-settings: "ss20" 1; }
        
        /* Brutalist styles */
        body {
            font-family: 'Cheltender-Regular', sans-serif;
        }
        
        /* Custom block button - Redesigned from pill to block */
        .block-button {
            @apply border border-black flex items-center justify-center py-2 px-4 h-10 text-sm
                   dark:border-white hover:bg-black hover:text-white 
                   dark:hover:bg-white dark:hover:text-black transition-colors duration-200;
        }
        
        .block-button-active {
            @apply bg-accent text-black border-accent;
        }

        /* Action button - made consistent with block buttons */
        .action-button {
            @apply border border-black bg-accent text-black px-4 py-2 h-10 inline-flex items-center justify-center text-sm font-bold transition-colors duration-200;
        }
        
        /* Results container */
        .results-container {
            max-height: 250px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #000 #fff;
        }
        
        .results-container::-webkit-scrollbar {
            width: 2px;
        }
        
        .results-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .results-container::-webkit-scrollbar-thumb {
            background-color: #000;
        }
        
        .dark .results-container::-webkit-scrollbar-thumb {
            background-color: #fff;
        }
        
        /* Grid lines */
        .grid-line {
            height: 1px;
            width: 100%;
            @apply bg-black/20 dark:bg-white/20;
        }
        
        .grid-line-vertical {
            width: 1px;
            height: 100%;
            @apply bg-black/20 dark:bg-white/20;
        }

        /* Copy button hover */
        .copy-btn:hover {
            @apply text-accent;
        }
    </style>
</head>
<body class="bg-white text-black dark:bg-dark dark:text-white font-cheltender min-h-screen">
    <!-- Header -->

    <main class="container mx-auto px-4 py-8 max-w-5xl">

            <!-- Right panel -->

                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>

                    <div>

        <!-- Results Section -->

            <div class="grid-line my-4"></div>
            
            <!-- Pairs Section -->

                <!-- First position pairs -->

                <div class="text-xs opacity-60">©2025 KERNING CHECKER</div>
                <div class="text-xs opacity-60">V.2.0</div>
            </div>
            <div class="text-xs opacity-60 text-center">
                Designed by <a href="https://www.instagram.com/mikeyokei/" class="hover:text-accent hover:opacity-100 transition-colors duration-200">mikeyokei</a> • <a href="https://readymag.website/u31066456/5044520/" class="hover:text-accent hover:opacity-100 transition-colors duration-200">Website</a>
            </div>

    <script>
        // Character sets
        const latinAlphabet = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const latinDiacritics = 'àáâäæãåāèéêëēėęîïíīįìôöòóœøōõûüùúūÿÀÁÂÄÆÃÅĀÈÉÊËĒĖĘÎÏÍĪĮÌÔÖÒÓŒØŌÕÛÜÙÚŪŸçÇñÑßðÐþÞ';
        const vietnameseChars = 'ăâđêôơưĂÂĐÊÔƠƯáàảãạăắằẳẵặâấầẩẫậéèẻẽẹêếềểễệíìỉĩịóòỏõọôốồổỗộơớờởỡợúùủũụưứừửữựýỳỷỹỵÁÀẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬÉÈẺẼẸÊẾỀỂỄỆÍÌỈĨỊÓÒỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢÚÙỦŨỤƯỨỪỬỮỰÝỲỶỸỴ';
        const numbers = '0123456789';
        const punctuation = '.,;:!?\'"\\/()[]{}<>@#$%^&*_-+=|~`';
        const symbols = '€£¥₹₽¢¤§©®™°′″‰¶†‡•…‱⁂⁋⁎⁑⁠⁰⁴⁵⁶⁷⁸⁹⁺⁻⁼⁽⁾ⁿ₀₁₂₃₄₅₆₇₈₉₊₋₌₍₎';

        // DOM Elements
        const selectedLetterInput = document.getElementById('selectedLetter');
        const checkButton = document.getElementById('checkButton');
        const toggleVietnameseBtn = document.getElementById('toggleVietnameseBtn');
        const toggleNumbersBtn = document.getElementById('toggleNumbersBtn');
        const togglePunctuationBtn = document.getElementById('togglePunctuationBtn');
        const toggleLatinBtn = document.getElementById('toggleLatinBtn');
        const toggleLatinDiacriticsBtn = document.getElementById('toggleLatinDiacriticsBtn');
        const toggleSymbolsBtn = document.getElementById('toggleSymbolsBtn');
        const fontUpload = document.getElementById('fontUpload');
        const fontSizeSelect = document.getElementById('fontSizeSelect');
        const toggleKerning = document.getElementById('toggleKerning');
        const kerningDot = document.getElementById('kerningDot');
        const stylisticSetSelect = document.getElementById('stylisticSetSelect');
        const regenerateButton = document.getElementById('regenerateButton');
        const copyAllButton = document.getElementById('copyAllButton');

        // State
        let includeVietnamese = false;
        let includeNumbers = false;
        let includePunctuation = false;
        let includeLatinDiacritics = false;
        let includeSymbols = false;
        let includeLatin = true; // Always true
        let customFontName = 'Cheltender-Regular'; // Default font name

        // Dark mode detection
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // Update toggle switch appearance
        toggleKerning.addEventListener('change', function() {
            if (this.checked) {
                kerningDot.style.transform = 'translateX(20px)';
                kerningDot.classList.add('bg-accent');
                kerningDot.classList.remove('bg-black', 'dark:bg-white');
            } else {
                kerningDot.style.transform = 'translateX(0)';
                kerningDot.classList.remove('bg-accent');
                kerningDot.classList.add('bg-black', 'dark:bg-white');
            }
            updateStyles();
        });
        
        // Initialize toggle switch appearance
        if (toggleKerning.checked) {
            kerningDot.style.transform = 'translateX(20px)';
            kerningDot.classList.add('bg-accent');
            kerningDot.classList.remove('bg-black', 'dark:bg-white');
        }

        // Font upload handling
        fontUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const fontData = e.target.result;
                    const fontName = file.name.split('.')[0];
                    customFontName = fontName;
                    
                    // Create a new @font-face rule for the uploaded font
                    const fontFace = `
                        @font-face {
                            font-family: '${fontName}';
                            src: url('${fontData}') format('${getFormat(file.name)}');
                            font-weight: normal;
                            font-style: normal;
                        }
                    `;
                    
                    // Add the new font-face to the document
                    const style = document.createElement('style');
                    style.textContent = fontFace;
                    document.head.appendChild(style);
                    
                    // Update all text with the new font
                    updateStyles();
                    
                    // Update the font name in the header
                    document.querySelector('header .text-xs').textContent = `FONT: ${fontName.toUpperCase()}`;
                };
                
                reader.readAsDataURL(file);
            }
        });

        // Helper function to determine font format
        function getFormat(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch (ext) {
                case 'ttf': return 'truetype';
                case 'otf': return 'opentype';
                case 'woff': return 'woff';
                case 'woff2': return 'woff2';
                default: return 'truetype';
            }
        }

        // Toggle button style helper
        function updateButtonStyle(button, isActive) {
            // Get the corresponding indicator
            let indicatorId;
            if (button.id === 'toggleLatinDiacriticsBtn') indicatorId = 'diacriticsIndicator';
            else if (button.id === 'toggleVietnameseBtn') indicatorId = 'vietnameseIndicator';
            else if (button.id === 'toggleNumbersBtn') indicatorId = 'numbersIndicator';
            else if (button.id === 'togglePunctuationBtn') indicatorId = 'punctuationIndicator';
            else if (button.id === 'toggleSymbolsBtn') indicatorId = 'symbolsIndicator';
            
            const indicator = indicatorId ? document.getElementById(indicatorId) : null;
            
            if (isActive) {
                button.classList.add('block-button-active');
                if (indicator) indicator.classList.remove('opacity-0');
            } else {
                button.classList.remove('block-button-active');
                if (indicator) indicator.classList.add('opacity-0');
            }
        }

        // Toggle button event listeners
        toggleVietnameseBtn.addEventListener('click', () => {
            includeVietnamese = !includeVietnamese;
            updateButtonStyle(toggleVietnameseBtn, includeVietnamese);
            generatePairs();
        });

        toggleNumbersBtn.addEventListener('click', () => {
            includeNumbers = !includeNumbers;
            updateButtonStyle(toggleNumbersBtn, includeNumbers);
            generatePairs();
        });

        togglePunctuationBtn.addEventListener('click', () => {
            includePunctuation = !includePunctuation;
            updateButtonStyle(togglePunctuationBtn, includePunctuation);
            generatePairs();
        });
        
        toggleLatinDiacriticsBtn.addEventListener('click', () => {
            includeLatinDiacritics = !includeLatinDiacritics;
            updateButtonStyle(toggleLatinDiacriticsBtn, includeLatinDiacritics);
            generatePairs();
        });
        
        toggleSymbolsBtn.addEventListener('click', () => {
            includeSymbols = !includeSymbols;
            updateButtonStyle(toggleSymbolsBtn, includeSymbols);
            generatePairs();
        });

        // Font size, kerning, and stylistic set change listeners
        fontSizeSelect.addEventListener('change', updateStyles);
        toggleKerning.addEventListener('change', updateStyles);
        stylisticSetSelect.addEventListener('change', updateStyles);

        // Generate pairs and triplets when the button is clicked
        checkButton.addEventListener('click', generatePairs);

        // Allow generating pairs by pressing Enter in the input field
        selectedLetterInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                generatePairs();
            }
        });

        // Set initial focus
        selectedLetterInput.focus();

        // Main function to generate pairs and triplets with performance optimizations
        function generatePairs() {
            const selectedLetter = selectedLetterInput.value;
            
            if (!selectedLetter) {
                alert('Please enter a letter first');
                return;
            }

            // Get the active character set
            let charSet = latinAlphabet;
            if (includeLatinDiacritics) charSet += latinDiacritics;
            if (includeVietnamese) charSet += vietnameseChars;
            if (includeNumbers) charSet += numbers;
            if (includePunctuation) charSet += punctuation;
            if (includeSymbols) charSet += symbols;

            // Show regenerate button if it's hidden
            regenerateButton.classList.remove('hidden');
            
            // Use DocumentFragment for better performance
            const resultIds = [
                'firstPosResults', 
                'secondPosResults', 
                'tripletFirstResults', 
                'tripletMiddleResults', 
                'tripletLastResults'
            ];
            
            // Clear all results at once
            resultIds.forEach(id => {
                document.getElementById(id).innerHTML = '';
            });
            
            // Create fragments for better performance
            const fragments = {
                firstPos: document.createDocumentFragment(),
                secondPos: document.createDocumentFragment(),
                tripletFirst: document.createDocumentFragment(),
                tripletMiddle: document.createDocumentFragment(),
                tripletLast: document.createDocumentFragment()
            };
            
            // Generate pairs (much faster with a single loop)
            const charSetArray = [...charSet];
            const charSetLength = charSetArray.length;
            
            // First create all spans in a single pass
            for (let i = 0; i < charSetLength; i++) {
                const char = charSetArray[i];
                
                // Pairs
                const firstPosSpan = document.createElement('span');
                firstPosSpan.textContent = selectedLetter + char + ' ';
                fragments.firstPos.appendChild(firstPosSpan);
                
                const secondPosSpan = document.createElement('span');
                secondPosSpan.textContent = char + selectedLetter + ' ';
                fragments.secondPos.appendChild(secondPosSpan);
                
                // Only generate triplets at specified intervals (every 5th character)
                if (i % 5 === 0) {
                    for (let j = 0; j < charSetLength; j += 5) {
                        const char2 = charSetArray[j];
                        
                        // Triplets
                        const tripletFirstSpan = document.createElement('span');
                        tripletFirstSpan.textContent = selectedLetter + char + char2 + ' ';
                        fragments.tripletFirst.appendChild(tripletFirstSpan);
                        
                        const tripletMiddleSpan = document.createElement('span');
                        tripletMiddleSpan.textContent = char + selectedLetter + char2 + ' ';
                        fragments.tripletMiddle.appendChild(tripletMiddleSpan);
                        
                        const tripletLastSpan = document.createElement('span');
                        tripletLastSpan.textContent = char + char2 + selectedLetter + ' ';
                        fragments.tripletLast.appendChild(tripletLastSpan);
                    }
                }
            }
            
            // Append all fragments to the DOM (only 5 reflows instead of hundreds)
            document.getElementById('firstPosResults').appendChild(fragments.firstPos);
            document.getElementById('secondPosResults').appendChild(fragments.secondPos);
            document.getElementById('tripletFirstResults').appendChild(fragments.tripletFirst);
            document.getElementById('tripletMiddleResults').appendChild(fragments.tripletMiddle);
            document.getElementById('tripletLastResults').appendChild(fragments.tripletLast);
            
            // Apply styles to all results
            updateStyles();
        }

        // Copy button functionality for individual sections using modern Clipboard API
        document.querySelectorAll('.copy-btn').forEach(button => {
            button.addEventListener('click', async () => {
                const targetId = button.getAttribute('data-target');
                const targetElement = document.getElementById(targetId);
                
                try {
                    // Use modern Clipboard API
                    await navigator.clipboard.writeText(targetElement.textContent);
                    
                    // Visual feedback
                    const originalText = button.textContent.trim();
                    button.textContent = 'COPIED';
                    button.classList.remove('opacity-60');
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.add('opacity-60');
                    }, 2000);
                } catch (err) {
                    // Fallback to old method if Clipboard API fails
                    const textarea = document.createElement('textarea');
                    textarea.value = targetElement.textContent;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    
                    // Visual feedback
                    const originalText = button.textContent.trim();
                    button.textContent = 'COPIED';
                    button.classList.remove('opacity-60');
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.add('opacity-60');
                    }, 2000);
                }
            });
        });
        
        // Visual feedback on copy actions using modern Clipboard API
        copyAllButton.addEventListener('click', async () => {
            // Collect all text content
            const resultIds = [
                'firstPosResults', 
                'secondPosResults', 
                'tripletFirstResults', 
                'tripletMiddleResults', 
                'tripletLastResults'
            ];
            
            const allSections = resultIds.map(id => document.getElementById(id));
            
            // Create headings and content
            const sections = [
                "--- LETTER PAIRS (FIRST POSITION) ---\n",
                allSections[0].textContent,
                "\n\n--- LETTER PAIRS (SECOND POSITION) ---\n",
                allSections[1].textContent,
                "\n\n--- LETTER TRIPLETS (FIRST POSITION) ---\n",
                allSections[2].textContent,
                "\n\n--- LETTER TRIPLETS (MIDDLE POSITION) ---\n",
                allSections[3].textContent,
                "\n\n--- LETTER TRIPLETS (LAST POSITION) ---\n",
                allSections[4].textContent
            ];
            
            try {
                // Use modern Clipboard API
                await navigator.clipboard.writeText(sections.join(''));
                
                // Visual feedback
                const originalContent = copyAllButton.textContent;
                copyAllButton.textContent = 'ALL COPIED';
                copyAllButton.classList.add('bg-accent', 'text-black', 'border-accent');
                setTimeout(() => {
                    copyAllButton.textContent = originalContent;
                    copyAllButton.classList.remove('bg-accent', 'text-black', 'border-accent');
                }, 2000);
            } catch (err) {
                // Fallback to old method if Clipboard API fails
                const textarea = document.createElement('textarea');
                textarea.value = sections.join('');
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                // Visual feedback
                const originalContent = copyAllButton.textContent;
                copyAllButton.textContent = 'ALL COPIED';
                copyAllButton.classList.add('bg-accent', 'text-black', 'border-accent');
                setTimeout(() => {
                    copyAllButton.textContent = originalContent;
                    copyAllButton.classList.remove('bg-accent', 'text-black', 'border-accent');
                }, 2000);
            }
        });

        // Add regenerate button functionality
        regenerateButton.addEventListener('click', generatePairs);

        // Update font styles, kerning, and stylistic sets
        function updateStyles() {
            const isKerningEnabled = toggleKerning.checked;
            const fontSize = fontSizeSelect.value;
            const selectedStylisticSet = stylisticSetSelect.value;
            
            // Get all result containers
            const resultContainers = [
                document.getElementById('firstPosResults'),
                document.getElementById('secondPosResults'),
                document.getElementById('tripletFirstResults'),
                document.getElementById('tripletMiddleResults'),
                document.getElementById('tripletLastResults')
            ];
            
            // Apply styles to all result containers
            resultContainers.forEach(container => {
                // Apply font size
                container.classList.remove('text-xl', 'text-2xl', 'text-3xl', 'text-4xl');
                container.classList.add(fontSize);
                
                // Apply custom font
                container.style.fontFamily = `'${customFontName}', sans-serif`;
                
                // First, remove all stylistic set classes
                for (let i = 1; i <= 20; i++) {
                    const ssClass = `ss${i.toString().padStart(2, '0')}`;
                    container.classList.remove(ssClass);
                }
                
                // Clear any existing font-feature-settings
                container.style.fontFeatureSettings = '';
                
                // Apply kerning and stylistic sets using inline style for proper combination
                if (selectedStylisticSet !== 'none' && isKerningEnabled) {
                    // Both kerning and stylistic set
                    container.style.fontFeatureSettings = `"kern" 1, "${selectedStylisticSet}" 1`;
                    container.classList.remove('kern-display', 'no-kern');
                } else if (selectedStylisticSet !== 'none') {
                    // Only stylistic set, no kerning
                    container.style.fontFeatureSettings = `"kern" 0, "${selectedStylisticSet}" 1`;
                    container.classList.remove('kern-display', 'no-kern');
                } else if (isKerningEnabled) {
                    // Only kerning, no stylistic set
                    container.classList.add('kern-display');
                    container.classList.remove('no-kern');
                    container.style.fontFeatureSettings = '';
                } else {
                    // Neither kerning nor stylistic set
                    container.classList.add('no-kern');
                    container.classList.remove('kern-display');
                    container.style.fontFeatureSettings = '';
                }
            });
        }
        
        // Initialize with default styles
        updateStyles();
    </script>
</body>
